name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup signing
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "No signing key configured, skipping signing setup."
            exit 0
          fi

          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> local.properties
          echo "KEYSTORE_ALIAS=$KEYSTORE_ALIAS" >> local.properties
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> local.properties
          echo "KEY_LOCATE=../release.keystore" >> local.properties

          echo "$SIGNING_KEY" | base64 --decode > release.keystore

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Check AndroidX dependency
        shell: bash
        run: |
          set -e
          URL="https://dl.google.com/dl/android/maven2/androidx/legacy/legacy-support-core-utils/1.0.0/legacy-support-core-utils-1.0.0.pom"
          echo "Checking: $URL"
          curl -fL --retry 3 --retry-delay 2 -I "$URL"

      - name: Build Normal Release
        shell: bash
        run: |
          set -o pipefail

          for i in 1 2 3; do
            echo "===== Build attempt $i/3 ====="

            if ./gradlew assembleNormalRelease --stacktrace --no-daemon; then
              echo "Build succeeded."
              exit 0
            fi

            if [ "$i" -lt 3 ]; then
              echo "Build failed. Retrying in 15 seconds..."
              sleep 15
            fi
          done

          echo "Build failed after 3 attempts."
          exit 1

      - name: Upload APK
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: MiPushFramework-NormalRelease
          path: |
            **/build/outputs/apk/**/*.apk
          if-no-files-found: error
