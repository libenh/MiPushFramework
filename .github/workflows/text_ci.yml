name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup signing
        if: ${{ secrets.SIGNING_KEY != '' }}
        shell: bash
        run: |
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> local.properties
          echo "KEYSTORE_ALIAS=${{ secrets.KEYSTORE_ALIAS }}" >> local.properties
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> local.properties
          echo "KEY_LOCATE=../release.keystore" >> local.properties
          echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > release.keystore

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Check Gradle
        run: ./gradlew --version

      - name: Check repositories
        shell: bash
        run: |
          echo "Checking Google Maven..."
          curl -I --retry 3 --retry-delay 2 \
            --connect-timeout 20 \
            --max-time 60 \
            https://dl.google.com/dl/android/maven2/ || true

          echo "Checking Maven Central..."
          curl -I --retry 3 --retry-delay 2 \
            --connect-timeout 20 \
            --max-time 60 \
            https://repo.maven.apache.org/maven2/ || true

      - name: Build
        shell: bash
        run: |
          set +e

          for i in 1 2 3; do
            echo "========================================"
            echo "Gradle build attempt: $i / 3"
            echo "========================================"

            ./gradlew build \
              --stacktrace \
              --no-daemon

            status=$?

            if [ "$status" -eq 0 ]; then
              echo "Build succeeded."
              exit 0
            fi

            echo "Build failed with exit code: $status"

            if [ "$i" -lt 3 ]; then
              echo "Waiting 15 seconds before retry..."
              sleep 15
            fi
          done

          echo "Build failed after 3 attempts."
          exit 1

      - name: Collect APKs
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts
          find . -type f -name "*.apk" -exec cp {} artifacts/ \;

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MiPushFramework-${{ github.sha }}
          path: artifacts/
          if-no-files-found: warn
