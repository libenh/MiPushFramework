name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Check Java and Gradle
        run: |
          java -version
          ./gradlew --version

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Prepare signing configuration
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            printf '%s\n' "$KEYSTORE_PASSWORD" >> /tmp/keystore_password
            printf '%s\n' "$KEYSTORE_ALIAS" >> /tmp/keystore_alias
            printf '%s\n' "$KEY_PASSWORD" >> /tmp/key_password

            {
              echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "KEYSTORE_ALIAS=$KEYSTORE_ALIAS"
              echo "KEY_PASSWORD=$KEY_PASSWORD"
              echo "KEY_LOCATE=$GITHUB_WORKSPACE/release.keystore"
            } > local.properties

            printf '%s' "$SIGNING_KEY" | base64 --decode > release.keystore

            test -s release.keystore
            echo "Signing keystore prepared."
          else
            echo "No signing key configured."
            echo "Gradle debug signing configuration will be used."
          fi

      - name: Verify project structure
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f gradlew
          test -d push
          test -d common
          test -d condom
          test -d mipush_hook

      - name: Verify TinyPinyin dependency
        run: |
          grep -R "tinypinyin" -n \
            build.gradle \
            push/build.gradle \
            common/build.gradle \
            condom/build.gradle \
            mipush_hook/build.gradle \
            2>/dev/null || true

      - name: Resolve Gradle dependencies
        run: |
          ./gradlew \
            :push:dependencies \
            --configuration normalDebugRuntimeClasspath \
            --refresh-dependencies \
            --stacktrace

      - name: Build Normal Release
        run: |
          ./gradlew \
            :push:assembleNormalRelease \
            --refresh-dependencies \
            --stacktrace \
            --no-daemon

      - name: Build VC105 Release
        run: |
          ./gradlew \
            :push:assembleVc105Release \
            --refresh-dependencies \
            --stacktrace \
            --no-daemon

      - name: Build Normal Debug
        run: |
          ./gradlew \
            :push:assembleNormalDebug \
            --refresh-dependencies \
            --stacktrace \
            --no-daemon

      - name: Build VC105 Debug
        run: |
          ./gradlew \
            :push:assembleVc105Debug \
            --refresh-dependencies \
            --stacktrace \
            --no-daemon

      - name: List APK files
        if: always()
        run: |
          echo "===== APK files ====="
          find push/build/outputs/apk -type f -name "*.apk" -print 2>/dev/null || true

      - name: Upload Normal Release
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: normal-release
          path: push/build/outputs/apk/normal/release/*.apk
          if-no-files-found: error

      - name: Upload VC105 Release
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: vc105-release
          path: push/build/outputs/apk/vc105/release/*.apk
          if-no-files-found: error

      - name: Upload Normal Debug
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: normal-debug
          path: push/build/outputs/apk/normal/debug/*.apk
          if-no-files-found: error

      - name: Upload VC105 Debug
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: vc105-debug
          path: push/build/outputs/apk/vc105/debug/*.apk
          if-no-files-found: error

      - name: Cleanup signing files
        if: always()
        run: |
          rm -f release.keystore
          rm -f local.properties
          rm -f /tmp/keystore_password
          rm -f /tmp/keystore_alias
          rm -f /tmp/key_password

  release:
    name: Create GitHub Release
    needs: build
    if: |
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download Normal Release
        uses: actions/download-artifact@v8
        with:
          name: normal-release
          path: release/normal

      - name: Download VC105 Release
        uses: actions/download-artifact@v8
        with:
          name: vc105-release
          path: release/vc105

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: true
          generate_release_notes: true
          files: |
            release/normal/*.apk
            release/vc105/*.apk