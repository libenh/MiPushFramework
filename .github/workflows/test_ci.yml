name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup signing
        if: ${{ secrets.SIGNING_KEY != '' }}
        shell: bash
        run: |
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> local.properties
          echo "KEYSTORE_ALIAS=${{ secrets.KEYSTORE_ALIAS }}" >> local.properties
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> local.properties
          echo "KEY_LOCATE=../release.keystore" >> local.properties
          echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > release.keystore

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Check Gradle
        run: ./gradlew --version

      - name: Build
        run: ./gradlew build

      - name: Collect APKs
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts
          find . -type f -name "*.apk" -exec cp {} artifacts/ \;

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MiPushFramework-${{ github.sha }}
          path: artifacts/
          if-no-files-found: warn
