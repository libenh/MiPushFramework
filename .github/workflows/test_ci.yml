name: Test CI

on:
  push:
    branches: [master]
    paths:
      - 'push/**'
      - 'common/**'
      - 'mipush_hook/**'
      - 'condom/**'
      - 'gradle/**'
      - 'gradlew'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/test_ci.yml'
  pull_request:
    branches: [master]
    paths:
      - 'push/**'
      - 'common/**'
      - 'mipush_hook/**'
      - 'condom/**'
      - 'gradle/**'
      - 'gradlew'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/test_ci.yml'
  workflow_dispatch:

concurrency:
  group: mipushframework-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Write signing key
        run: |
          if [ -n "${{ secrets.SIGNING_KEY }}" ]; then
            echo KEYSTORE_PASSWORD='${{ secrets.KEYSTORE_PASSWORD }}' >> local.properties
            echo KEYSTORE_ALIAS='${{ secrets.KEYSTORE_ALIAS }}' >> local.properties
            echo KEY_PASSWORD='${{ secrets.KEY_PASSWORD }}' >> local.properties
            echo KEY_LOCATE='../release.keystore' >> local.properties
            echo '${{ secrets.SIGNING_KEY }}' | base64 --decode > release.keystore
          else
            keytool -genkeypair -noprompt \
              -keystore .yuuta.jks \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -dname "CN=MiPushFramework CI,O=libenh,C=CN" \
              -keyalg RSA -keysize 2048 -validity 10000
            echo "KEYSTORE_PASS=android" >> "$GITHUB_ENV"
            echo "ALIAS_NAME=androiddebugkey" >> "$GITHUB_ENV"
            echo "ALIAS_PASS=android" >> "$GITHUB_ENV"
          fi

      - name: Get version
        id: version
        uses: proudust/gh-describe@v2.1.0
        with:
          exclude: v*-*

      - name: Build normal + vc105 (O-series)
        run: |
          chmod +x gradlew
          ./gradlew :push:assembleNormalRelease :push:assembleVc105Release --no-daemon -PversionName=${{ steps.version.outputs.describe }}

      - name: Prepare APKs
        id: apk
        run: |
          VERSION="${{ steps.version.outputs.describe }}"
          NORMAL=$(find push/build/outputs/apk/normal/release -maxdepth 1 -type f -name '*.apk' | head -n 1)
          VC105=$(find push/build/outputs/apk/vc105/release -maxdepth 1 -type f -name '*.apk' | head -n 1)
          test -n "$NORMAL"
          test -n "$VC105"
          cp "$NORMAL" "${VERSION}-normal.apk"
          cp "$VC105" "${VERSION}-vc105-O系.apk"
          echo "normal=${VERSION}-normal.apk" >> "$GITHUB_OUTPUT"
          echo "vc105=${VERSION}-vc105-O系.apk" >> "$GITHUB_OUTPUT"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: MiPushFramework
          path: |
            ${{ steps.apk.outputs.normal }}
            ${{ steps.apk.outputs.vc105 }}
          retention-days: 14

      - name: Publish prerelease
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.describe }}
          tag_name: ${{ steps.version.outputs.describe }}
          target_commitish: ${{ steps.version.outputs.sha }}
          prerelease: true
          files: |
            ${{ steps.apk.outputs.normal }}
            ${{ steps.apk.outputs.vc105 }}
          body: |
            ## 下载说明
            - **normal**：默认，versionCode 高，bindService 路径；MIUI 优先
            - **vc105-O系**：versionCode=105，startService 路径；**ColorOS / OxygenOS / OnePlus 推荐**

            ColorOS 17 注册/消息异常时请优先安装 vc105。
