name: Test CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: mipushframework-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Write signing key
        run: |
          if [ -n "${{ secrets.SIGNING_KEY }}" ]; then
            echo KEYSTORE_PASSWORD='${{ secrets.KEYSTORE_PASSWORD }}' >> local.properties
            echo KEYSTORE_ALIAS='${{ secrets.KEYSTORE_ALIAS }}' >> local.properties
            echo KEY_PASSWORD='${{ secrets.KEY_PASSWORD }}' >> local.properties
            echo KEY_LOCATE='../release.keystore' >> local.properties
            echo '${{ secrets.SIGNING_KEY }}' | base64 --decode > release.keystore
          else
            keytool -genkeypair -noprompt \
              -keystore .yuuta.jks \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -dname "CN=MiPushFramework CI,O=libenh,C=CN" \
              -keyalg RSA -keysize 2048 -validity 10000
            echo "KEYSTORE_PASS=android" >> "$GITHUB_ENV"
            echo "ALIAS_NAME=androiddebugkey" >> "$GITHUB_ENV"
            echo "ALIAS_PASS=android" >> "$GITHUB_ENV"
          fi

      - name: Get version
        id: version
        uses: proudust/gh-describe@v2.1.0
        with:
          exclude: v*-*

      - name: Build O-compatible release APK
        run: |
          chmod +x gradlew
          ./gradlew :push:assembleNormalRelease --no-daemon -PversionName=${{ steps.version.outputs.describe }}

      - name: Prepare APK
        id: apk
        run: |
          APK=$(find push/build/outputs/apk/normal/release -maxdepth 1 -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          VERSION="${{ steps.version.outputs.describe }}"
          OUTPUT="${VERSION}.apk"
          cp "$APK" "$OUTPUT"
          echo "file=$OUTPUT" >> "$GITHUB_OUTPUT"

      - name: Upload O-compatible APK
        uses: actions/upload-artifact@v4
        with:
          name: MiPushFramework
          path: ${{ steps.apk.outputs.file }}
          retention-days: 7

      - name: Publish prerelease
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.describe }}
          tag_name: ${{ steps.version.outputs.describe }}
          target_commitish: ${{ steps.version.outputs.sha }}
          prerelease: true
          files: ${{ steps.apk.outputs.file }}
